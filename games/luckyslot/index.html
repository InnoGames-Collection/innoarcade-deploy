<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>" />
    <title>Lucky Slot — GoPlay</title>
  </head>
  <body class="game-shell casual-shell brain-shell" data-game="luckyslot">
    <div id="stage" class="fc-stage game-shell-stage">
      <div id="fcBackdrop" class="fc-backdrop" aria-hidden="true"></div>

      <div id="fcPlayFrame" class="fc-playframe hidden">
        

        <div id="slot-game-wrapper">
          <div class="slot-game-container">
            <div class="slot-machine" id="slot-machine-body">
              <div class="slot-reels-container">
                <div class="slot-reel"><div class="slot-symbol-strip" id="slot-reel1"></div></div>
                <div class="slot-reel"><div class="slot-symbol-strip" id="slot-reel2"></div></div>
                <div class="slot-reel"><div class="slot-symbol-strip" id="slot-reel3"></div></div>
              </div>
              <div class="slot-controls">
                <div class="slot-message" id="slot-message-display"></div>
                <button class="slot-spin-btn" id="slot-spinBtn" data-i18n="hub.play">Play</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="menuOverlay" class="game-overlay">
        <div class="game-panel panel-clean">
          
          <div class="shell-free-menu" id="freeMenu"></div>
          <button id="startBtn" class="btn primary" data-i18n="hub.play">Play</button>
        </div>
      </div>

      <div id="overOverlay" class="game-overlay chance-over hidden" aria-hidden="true">
        <div class="game-panel">
          
          <h2 id="fcOverTitle" class="fc-over-headline"></h2>
          <p id="fcOverScore" class="fc-over-score hidden"></p>
          <div class="shell-run-reward" id="runReward"></div>
          <button id="againBtn" class="btn primary" data-i18n="td.restart">Play again</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script type="module" src="/src/games/luckyslot/main.ts"></script>
  </body>
</html>
